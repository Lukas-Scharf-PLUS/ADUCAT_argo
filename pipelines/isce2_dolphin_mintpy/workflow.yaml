# Argo workflow: the isce2-dolphin-mintpy InSAR chain from Sentinel-1 download to point file.
#
#   download-slc -> download-orbits -> isce -> dolphin -> mintpy -> postprocess
#
# - isce:        ISCE2 topsStack coregistration with ESD of all bursts covering the
#                AOI, then the AOI crop in radar coordinates and the water mask.
# - dolphin:     phase linking, interferograms and unwrapping on the cropped stack.
# - mintpy:      network inversion, corrections and geocoding.
# - postprocess: one GeoParquet point file (mintpy_postprocessing).
# isce, dolphin and mintpy are separate steps of the same image, so the log and
# the uploaded output of each stage are separate. The volume is deleted with the
# workflow: a failed run is resubmitted from the start.
#
# All steps share one volume (ephemeral-workdir, mounted at /work):
#
#   /work/input/      slc/, orbits/        downloaded by the first two steps
#                     dem/, watermask/,    loaded from the bucket as input artifacts
#                     config/
#   /work/processed/  the pipeline's work_dir: isce/, crop/, dolphin/, mintpy/, logs/
#   /work/final/      S1_ASC_073_IW1-IW2_VV_<first>_<last>_<area_name>.parquet
#                     and .metadata.json (name built from the data)
#   /work/logs/       console logs of every step (argo_<step>.log), peak usage,
#                     storage_report.txt/.json
#
# Uploaded to <s3_output_prefix>/<workflow name>/: processed/crop, processed/dolphin,
# processed/mintpy, processed/logs, processed/pipeline_config.yaml, final/, logs/.
# The SLCs, orbits and the ISCE2 stack (~5 GB per date) are not uploaded.
#
# Submit with:  argo submit pipelines/isce2_dolphin_mintpy/workflow.yaml
# Other dates:  argo submit pipelines/isce2_dolphin_mintpy/workflow.yaml -p start_date=... -p end_date=...
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: isce2-dolphin-mintpy-
spec:
  entrypoint: main
  # Storage report after every run, also after a failure (see storage-report).
  onExit: storage-report
  serviceAccountName: aducat
  arguments:
    parameters:
      # --- SLC search (slc-downloader) ---
      - name: orbit_state
        value: ascending
      - name: relative_orbit
        value: "73"                    # must match slc_dir in the pipeline config
      - name: instrument_mode
        value: IW
      # Satellites to download: "all" or a subset such as "S1A" or "S1C S1D".
      # ISCE2's ESD corrects burst-boundary azimuth offsets, so mixed S1A/S1C
      # stacks are less of a problem here than in the compass-dolphin pipeline.
      - name: platforms
        value: all
      - name: start_date
        value: "2025-01-01"
      - name: end_date
        value: "2025-02-28"            # inclusive; a 2-month test stack
      - name: slc_bbox
        value: 16.18 48.11 16.59 48.33 # WEST SOUTH EAST NORTH, covers the AOI in the config
      - name: slc_max_threads
        value: "4"                     # CDSE allows 4 connections per user

      # --- inputs from the bucket (keys in the artifact repository bucket) ---
      # Same DEM and water mask as the compass-dolphin pipeline.
      - name: dem_key
        value: WP5_Infrastructure_and_Underground_Safety/DEM/cop_dem.tif
      - name: watermask_key
        value: WP5_Infrastructure_and_Underground_Safety/Watermask/watermask.tif
      - name: pipeline_config_key
        value: WP5_Infrastructure_and_Underground_Safety/argo_configs/isce2_dolphin_mintpy/ASC_073/pipeline.yaml

      # --- outputs ---
      - name: s3_output_prefix
        value: WP5_Infrastructure_and_Underground_Safety/ISCE2-DOLPHIN-MINTPY

      # --- post-processing ---
      # Area name in the point file name and metadata. Empty: no area name.
      - name: area_name
        value: vienna
      # Attribute groups or single columns to leave out, separated by spaces.
      # Groups: position, geometry, water, mintpy_quality, phase_linking,
      # persistent_scatterers, mintpy_velocity, dem_error, model, model_coherence,
      # displacement, displacement_std.
      - name: postprocess_exclude
        value: ""
      # "true": write every pixel, not only those in MintPy's final mask.
      - name: postprocess_all_pixels
        value: "false"

      # --- images ---
      # `latest` follows every push to main (imagePullPolicy: Always). Pin
      # sha-<commit> or version tags for reproducible runs.
      - name: downloader_image
        value: ghcr.io/lukas-scharf-plus/slc_downloader:latest
      - name: pipeline_image
        value: ghcr.io/lukas-scharf-plus/isce2-dolphin-mintpy:latest
      - name: postprocessing_image
        value: ghcr.io/lukas-scharf-plus/mintpy_postprocessing:latest

  templates:
    - name: main
      dag:
        tasks:
          - name: download-slc
            template: download-slc
          - name: download-orbits
            template: download-orbits
            dependencies: [download-slc]
          - name: isce
            template: isce
            dependencies: [download-orbits]
          - name: dolphin
            template: dolphin
            dependencies: [isce]
          - name: mintpy
            template: mintpy
            dependencies: [dolphin]
          - name: postprocess
            template: postprocess
            dependencies: [mintpy]

    - name: download-slc
      outputs:
        artifacts:
          - name: download-slc-log
            path: /work/logs/download-slc.log
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/logs/download-slc.log"
            archive:
              none: {}
      container:
        image: "{{workflow.parameters.downloader_image}}"
        # `command` replaces the image ENTRYPOINT; _entrypoint.sh activates the
        # micromamba environment, so it has to stay in front of bash/python.
        # bash gets the log file as $0 and the command as "$@" (see the header).
        command:
          - /usr/local/bin/_entrypoint.sh
          - bash
          - -c
          - 'set -o pipefail; mkdir -p "$(dirname "$0")"; "$@" 2>&1 | tee "$0"'
        args:
          - /work/logs/download-slc.log
          - python
          - src/download_slc.py
          - --orbit_state
          - "{{workflow.parameters.orbit_state}}"
          - --relative_orbit
          - "{{workflow.parameters.relative_orbit}}"
          - --instrument_mode
          - "{{workflow.parameters.instrument_mode}}"
          - --platforms
          - "{{workflow.parameters.platforms}}"
          - --start_date
          - "{{workflow.parameters.start_date}}"
          - --end_date
          - "{{workflow.parameters.end_date}}"
          - --bbox
          - "{{workflow.parameters.slc_bbox}}"
          - --max_threads
          - "{{workflow.parameters.slc_max_threads}}"
          - --threads_per_file
          - "1"
          - --base_path
          - /work/input/slc
        env:
          - name: cdse_S3_KEY
            valueFrom:
              secretKeyRef: {name: cdse, key: S3_KEY}
          - name: cdse_S3_SECRET
            valueFrom:
              secretKeyRef: {name: cdse, key: S3_SECRET}
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "4", memory: 8Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

    - name: download-orbits
      outputs:
        artifacts:
          - name: download-orbits-log
            path: /work/logs/download-orbits.log
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/logs/download-orbits.log"
            archive:
              none: {}
      container:
        image: "{{workflow.parameters.downloader_image}}"
        command:
          - /usr/local/bin/_entrypoint.sh
          - bash
          - -c
          - 'set -o pipefail; mkdir -p "$(dirname "$0")"; "$@" 2>&1 | tee "$0"'
        args:
          - /work/logs/download-orbits.log
          - python
          - src/download_orbits.py
          - --safe_dir
          - /work/input/slc
          - --orbit_dir
          - /work/input/orbits
        env:
          - name: cdse_S3_KEY
            valueFrom:
              secretKeyRef: {name: cdse, key: S3_KEY}
          - name: cdse_S3_SECRET
            valueFrom:
              secretKeyRef: {name: cdse, key: S3_SECRET}
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 2Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

    # ISCE2 topsStack coregistration (NESD) of the bursts covering the AOI, then
    # the AOI crop in radar coordinates and the water mask on dolphin's grid.
    # Argo loads the input artifacts straight into the shared volume.
    - name: isce
      inputs:
        artifacts:
          - name: dem
            path: /work/input/dem/cop_dem.tif
            s3: {key: "{{workflow.parameters.dem_key}}"}
          - name: watermask
            path: /work/input/watermask/watermask.tif
            s3: {key: "{{workflow.parameters.watermask_key}}"}
          - name: pipeline-config
            path: /work/input/config/pipeline.yaml
            s3: {key: "{{workflow.parameters.pipeline_config_key}}"}
      outputs:
        artifacts:
          # Small: VRT windows into the ISCE2 stack, crop window, water fraction.
          # The ISCE2 stack itself (~5 GB per date) is not uploaded.
          - name: crop
            path: /work/processed/crop
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/crop"
            archive:
              none: {}
          # All pipeline logs so far (ISCE2 per-command logs, dolphin, MintPy,
          # versions.json). Later steps upload the same key again with more logs.
          - name: logs-after-isce
            path: /work/processed/logs
            optional: true
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/logs"
            archive:
              none: {}
      container:
        image: "{{workflow.parameters.pipeline_image}}"
        # Log wrapper plus peak tracking (same as compass/dolphin in the
        # compass-dolphin workflow): samples the volume usage every 60 s and keeps
        # the maximum in $PEAK_FILE for the storage report.
        command:
          - /usr/local/bin/_entrypoint.sh
          - bash
          - -c
          - |
            set -o pipefail
            mkdir -p "$(dirname "$0")" "$(dirname "$PEAK_FILE")"
            ( max=0
              # On kill, also stop the running sleep instead of leaving it behind.
              trap 'kill "$nap" 2>/dev/null; exit 0' TERM
              while :; do
                used=$(df -B1 --output=used /work | tail -n 1 | tr -d ' ')
                if [ "$used" -gt "$max" ]; then max=$used; echo "$max" > "$PEAK_FILE"; fi
                sleep 60 & nap=$!
                wait "$nap"
              done ) &
            sampler=$!
            "$@" 2>&1 | tee "$0"
            status=$?
            kill "$sampler" 2>/dev/null
            exit "$status"
        env:
          - name: PEAK_FILE
            value: /work/logs/peak_isce.bytes
        args:
          - /work/logs/argo_isce.log
          - python
          - -m
          - isce_dolphin_mintpy
          - run
          - /work/input/config/pipeline.yaml
          - --steps
          - isce
          - crop
        resources:
          # num_proc x omp_threads in the pipeline config = 4 x 2 = 8 CPUs.
          requests: {cpu: "8", memory: 32Gi}
          limits: {cpu: "15", memory: 56Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

    # Phase linking, interferograms and unwrapping on the cropped radar stack.
    - name: dolphin
      outputs:
        artifacts:
          - name: dolphin
            path: /work/processed/dolphin
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/dolphin"
            archive:
              none: {}
          # All pipeline logs so far (ISCE2 per-command logs, dolphin, MintPy,
          # versions.json). Later steps upload the same key again with more logs.
          - name: logs-after-dolphin
            path: /work/processed/logs
            optional: true
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/logs"
            archive:
              none: {}
      container:
        image: "{{workflow.parameters.pipeline_image}}"
        # Log wrapper plus peak tracking (same as compass/dolphin in the
        # compass-dolphin workflow): samples the volume usage every 60 s and keeps
        # the maximum in $PEAK_FILE for the storage report.
        command:
          - /usr/local/bin/_entrypoint.sh
          - bash
          - -c
          - |
            set -o pipefail
            mkdir -p "$(dirname "$0")" "$(dirname "$PEAK_FILE")"
            ( max=0
              # On kill, also stop the running sleep instead of leaving it behind.
              trap 'kill "$nap" 2>/dev/null; exit 0' TERM
              while :; do
                used=$(df -B1 --output=used /work | tail -n 1 | tr -d ' ')
                if [ "$used" -gt "$max" ]; then max=$used; echo "$max" > "$PEAK_FILE"; fi
                sleep 60 & nap=$!
                wait "$nap"
              done ) &
            sampler=$!
            "$@" 2>&1 | tee "$0"
            status=$?
            kill "$sampler" 2>/dev/null
            exit "$status"
        env:
          - name: PEAK_FILE
            value: /work/logs/peak_dolphin.bytes
        args:
          - /work/logs/argo_dolphin.log
          - python
          - -m
          - isce_dolphin_mintpy
          - run
          - /work/input/config/pipeline.yaml
          - --steps
          - dolphin
        resources:
          # threads_per_worker in the pipeline config = 8.
          requests: {cpu: "8", memory: 32Gi}
          limits: {cpu: "15", memory: 56Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

    # dolphin output -> MintPy inputs, network inversion, corrections, geocoding.
    - name: mintpy
      outputs:
        artifacts:
          - name: mintpy
            path: /work/processed/mintpy
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/mintpy"
            archive:
              none: {}
          - name: pipeline-config-used
            path: /work/processed/pipeline_config.yaml
            optional: true
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/pipeline_config.yaml"
            archive:
              none: {}
          # All pipeline logs so far (ISCE2 per-command logs, dolphin, MintPy,
          # versions.json). Later steps upload the same key again with more logs.
          - name: logs-after-mintpy
            path: /work/processed/logs
            optional: true
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/processed/logs"
            archive:
              none: {}
      container:
        image: "{{workflow.parameters.pipeline_image}}"
        # Log wrapper plus peak tracking (same as compass/dolphin in the
        # compass-dolphin workflow): samples the volume usage every 60 s and keeps
        # the maximum in $PEAK_FILE for the storage report.
        command:
          - /usr/local/bin/_entrypoint.sh
          - bash
          - -c
          - |
            set -o pipefail
            mkdir -p "$(dirname "$0")" "$(dirname "$PEAK_FILE")"
            ( max=0
              # On kill, also stop the running sleep instead of leaving it behind.
              trap 'kill "$nap" 2>/dev/null; exit 0' TERM
              while :; do
                used=$(df -B1 --output=used /work | tail -n 1 | tr -d ' ')
                if [ "$used" -gt "$max" ]; then max=$used; echo "$max" > "$PEAK_FILE"; fi
                sleep 60 & nap=$!
                wait "$nap"
              done ) &
            sampler=$!
            "$@" 2>&1 | tee "$0"
            status=$?
            kill "$sampler" 2>/dev/null
            exit "$status"
        env:
          - name: PEAK_FILE
            value: /work/logs/peak_mintpy.bytes
          # ERA5 downloads go to the shared volume, not the container's home.
          - name: WEATHER_DIR
            value: /work/processed/weather
          # Copernicus CDS credentials for ERA5 (mintpy.troposphere: pyaps), from the
          # Kubernetes secret `cds`. optional: the step also starts without the
          # secret; only an ERA5 correction would then fail.
          - name: CDS_URL
            valueFrom:
              secretKeyRef: {name: cds, key: CDS_URL, optional: true}
          - name: CDS_KEY
            valueFrom:
              secretKeyRef: {name: cds, key: CDS_KEY, optional: true}
        # MintPy and PyAPS read the CDS credentials only from ~/.cdsapirc, so the
        # file is written from CDS_URL and CDS_KEY first (if both are set).
        # MintPy expects the URL https://cds.climate.copernicus.eu/api.
        args:
          - /work/logs/argo_mintpy.log
          - bash
          - -c
          - >-
            if [ -n "$CDS_URL" ] && [ -n "$CDS_KEY" ]; then
            printf 'url: %s\nkey: %s\n' "$CDS_URL" "$CDS_KEY" > "$HOME/.cdsapirc";
            chmod 600 "$HOME/.cdsapirc"; fi;
            exec python -m isce_dolphin_mintpy run /work/input/config/pipeline.yaml --steps mintpy
        resources:
          requests: {cpu: "4", memory: 16Gi}
          limits: {cpu: "8", memory: 32Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

    # One GeoParquet point file with EGMS-style model parameters (mintpy_postprocessing).
    - name: postprocess
      outputs:
        artifacts:
          - name: points
            path: /work/final
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/final"
            archive:
              none: {}
      container:
        image: "{{workflow.parameters.postprocessing_image}}"
        # Same log wrapper as the download steps, plus `--exclude <names>` when
        # postprocess_exclude is not empty ($EXCLUDE is unquoted on purpose, so
        # "a b" becomes `--exclude a b`) and `--all-pixels` when requested.
        command:
          - /usr/local/bin/_entrypoint.sh
          - bash
          - -c
          - >-
            set -o pipefail; mkdir -p "$(dirname "$0")";
            if [ "$ALL_PIXELS" = true ]; then set -- "$@" --all-pixels; fi;
            "$@" ${EXCLUDE:+--exclude $EXCLUDE} 2>&1 | tee "$0"
        env:
          - name: EXCLUDE
            value: "{{workflow.parameters.postprocess_exclude}}"
          - name: ALL_PIXELS
            value: "{{workflow.parameters.postprocess_all_pixels}}"
          # Variables starting with INSAR_RUN_ are stored in the "run" section of
          # the point file's metadata.
          - name: INSAR_RUN_WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: INSAR_RUN_PIPELINE
            value: isce2-dolphin-mintpy
          - name: INSAR_RUN_REQUESTED_START_DATE
            value: "{{workflow.parameters.start_date}}"
          - name: INSAR_RUN_REQUESTED_END_DATE
            value: "{{workflow.parameters.end_date}}"
          - name: INSAR_RUN_PLATFORMS
            value: "{{workflow.parameters.platforms}}"
          - name: INSAR_RUN_DOWNLOADER_IMAGE
            value: "{{workflow.parameters.downloader_image}}"
          - name: INSAR_RUN_PIPELINE_IMAGE
            value: "{{workflow.parameters.pipeline_image}}"
          - name: INSAR_RUN_POSTPROCESSING_IMAGE
            value: "{{workflow.parameters.postprocessing_image}}"
        args:
          - /work/final/run_postprocessing.log
          - python
          - /app/run_postprocessing.py
          - --run-dir
          - /work/processed
          - --output-dir
          - /work/final
          - --area-name
          - "{{workflow.parameters.area_name}}"
        resources:
          requests: {cpu: "2", memory: 8Gi}
          limits: {cpu: "4", memory: 16Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

    # Exit handler (spec.onExit): runs after the DAG, also when a step failed.
    # Measures the disk use of every folder on the shared volume (ISCE2's
    # subfolders show where the space goes) and writes
    # logs/storage_report.txt and .json (also printed to the pod log).
    # Uses the downloader image only because it has Python, du and df.
    - name: storage-report
      outputs:
        artifacts:
          - name: storage-report-txt
            path: /work/logs/storage_report.txt
            optional: true
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/logs/storage_report.txt"
            archive:
              none: {}
          - name: storage-report-json
            path: /work/logs/storage_report.json
            optional: true
            s3:
              key: "{{workflow.parameters.s3_output_prefix}}/{{workflow.name}}/logs/storage_report.json"
            archive:
              none: {}
      script:
        image: "{{workflow.parameters.downloader_image}}"
        command: [/usr/local/bin/_entrypoint.sh, python]
        env:
          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"
          - name: WORKFLOW_STATUS
            value: "{{workflow.status}}"
        source: |
          """Storage report: disk use of the inputs, ISCE2, crop, dolphin, MintPy and the final output."""
          import datetime
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          WORK = Path("/work")
          LOG_DIR = WORK / "logs"
          BYTES_PER_GB = 1e9
          INPUT_FOLDERS = ("slc", "orbits", "dem", "watermask", "config")
          PROCESSED_FOLDERS = ("isce", "crop", "dolphin", "mintpy", "logs")
          PEAK_STEPS = ("isce", "dolphin", "mintpy")


          def disk_use(path):
              """Bytes used by a file or folder (du), or None if it does not exist."""
              if not path.exists():
                  return None
              result = subprocess.run(["du", "-sb", str(path)], capture_output=True, text=True)
              return int(result.stdout.split()[0]) if result.stdout else None


          def read_peak(step):
              """Peak volume usage recorded by a step's wrapper, or None."""
              try:
                  return int((LOG_DIR / f"peak_{step}.bytes").read_text().strip())
              except (OSError, ValueError):
                  return None


          def children(path, want_dirs):
              """Sorted subfolders (want_dirs=True) or files of a folder."""
              if not path.is_dir():
                  return []
              return sorted(p for p in path.iterdir() if p.is_dir() == want_dirs)


          def gb(value):
              return "-" if value is None else f"{value / BYTES_PER_GB:9.2f} GB"


          # (key in the JSON, label in the text report, path, note)
          entries = []
          slc_dir = WORK / "input" / "slc"
          safe_count = len(list(slc_dir.glob("*.SAFE"))) + len(list(slc_dir.glob("*/*.SAFE")))
          for name in INPUT_FOLDERS:
              note = f"{safe_count} SAFE" if name == "slc" else ""
              entries.append((f"input/{name}", f"input/{name}", WORK / "input" / name, note))
          for step in PROCESSED_FOLDERS:
              step_dir = WORK / "processed" / step
              entries.append((f"processed/{step}", f"processed/{step}", step_dir, ""))
              for sub in children(step_dir, want_dirs=True):
                  entries.append((f"processed/{step}/{sub.name}", f"  {sub.name}", sub, ""))
          entries.append(("final", "final", WORK / "final", ""))
          for file in children(WORK / "final", want_dirs=False):
              entries.append((f"final/{file.name}", f"  {file.name}", file, ""))

          sizes = {key: disk_use(path) for key, _, path, _ in entries}
          peaks = {step: read_peak(step) for step in PEAK_STEPS}
          volume = shutil.disk_usage(WORK)
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          workflow = os.environ.get("WORKFLOW_NAME", "")
          status = os.environ.get("WORKFLOW_STATUS", "")

          lines = [f"Storage report  {workflow}  status: {status}  ({now})", ""]
          for key, label, _, note in entries:
              lines.append(f"{label:<34}{gb(sizes[key])}   {note}".rstrip())
          lines += ["", "Peak volume usage while the step ran (sampled every 60 s):"]
          for step in PEAK_STEPS:
              lines.append(f"  {step:<32}{gb(peaks[step])}")
          lines += [
              "",
              f"{'volume used / size':<34}{gb(volume.used)} / {volume.total / BYTES_PER_GB:.0f} GB",
          ]
          report = "\n".join(lines)
          print(report)

          LOG_DIR.mkdir(parents=True, exist_ok=True)
          (LOG_DIR / "storage_report.txt").write_text(report + "\n")
          (LOG_DIR / "storage_report.json").write_text(json.dumps({
              "workflow": workflow,
              "status": status,
              "created_utc": now,
              "sizes_bytes": sizes,
              "peak_volume_used_bytes": peaks,
              "volume_bytes": {"used": volume.used, "total": volume.total},
          }, indent=2) + "\n")
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 2Gi}
        volumeMounts:
          - name: ephemeral-workdir
            mountPath: /work
        imagePullPolicy: Always

  # All three images run as the non-root user "mambauser" (UID/GID 57439);
  # fsGroup makes the volume writable for that user.
  securityContext:
    runAsUser: 57439
    runAsGroup: 57439
    fsGroup: 57439
    runAsNonRoot: true

  volumeClaimTemplates:
    - metadata:
        name: ephemeral-workdir
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            # Per date: ~8 GB SAFE + ~5 GB ISCE2 (coregistered and merged SLCs
            # of ~6 bursts for Vienna IW1+IW2), plus ~20 GB fixed geometry
            # (estimates from a 3-burst test). 2 months (5-10 dates) fit in
            # 300 GB; raise for longer periods (see the storage report).
            storage: 300Gi
        storageClassName: csi-disk

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node_group
                operator: In
                values: [usera]
  tolerations:
    - key: hub.jupyter.org_dedicated
      operator: Equal
      value: usera
      effect: NoSchedule

  # Delete the workflow 5 minutes after success; keep a failed one for 2 hours
  # so its logs can be inspected.
  ttlStrategy:
    secondsAfterSuccess: 300
    secondsAfterFailure: 7200
  podGC:
    strategy: OnWorkflowSuccess
